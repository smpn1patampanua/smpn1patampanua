<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Informasi SIPPN - UPT SMP Negeri 1 Patampanua</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 40px 20px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box;
        }
        .form-card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 550px; 
        }
        h2 { color: #0056b3; margin-top: 0; margin-bottom: 25px; font-size: 1.6rem; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 0.95rem; }
        input[type="text"], input[type="file"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ced4da; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 0.95rem; 
        }
        input[type="file"] { background: #fafafa; cursor: pointer; }
        .btn-submit { 
            background-color: #0056b3; 
            color: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.3s; 
        }
        .btn-submit:hover { background-color: #004085; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #dc3545; text-decoration: none; font-size: 0.95rem; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Tambah Informasi SIPPN Baru</h2>
        
        <form action="/tambah_sippn" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Judul / Nama Tombol Informasi:</label>
                <input type="text" name="judul_info" placeholder="Contoh: Layanan Pengaduan Alternatif" required>
            </div>

            <div class="form-group">
                <label>Pilih File Gambar Infografis:</label>
                <input type="file" name="gambar_info" accept="image/*" required>
            </div>

            <button type="submit" class="btn-submit">Simpan & Unggah Informasi</button>
        </form>

        <a href="/sippn" class="back-link">Kembali ke Halaman SIPPN</a>
    </div>

</body>
</html>
